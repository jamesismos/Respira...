name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Automated tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated service worker
        run: node -e 'const fs = require("node:fs"); const sw = fs.readFileSync("public/sw.js", "utf8"); if (!sw.includes("notificationclick") || !sw.includes("/offline")) throw new Error("Service worker missing offline fallback or notification handler"); console.log("Service worker generated with offline fallback and notification handler.")'
